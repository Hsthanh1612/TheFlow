name: Deploy to GitHub Pages

# KHÔNG dùng Firebase Hosting / App Hosting. Chỉ xuất bản thư mục dist (tài nguyên tĩnh) lên GitHub Pages.
# Chỉ chạy từ nhánh main; job build chỉ có quyền đọc, chỉ job deploy mới có pages:write + id-token:write.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Kiểm tra và build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: node scripts/check-secrets.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - name: Kiểm tra cấu hình Firebase production
        env:
          FB_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          FB_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          for v in FB_API_KEY FB_AUTH_DOMAIN FB_PROJECT_ID FB_APP_ID; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu biến repository (Settings > Variables) tương ứng ${v}"; exit 1; fi
          done
          case "$FB_PROJECT_ID" in demo-*) echo "::error::Không dùng project demo/emulator cho production"; exit 1;; esac
      - name: Build production
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build
      - name: Bảo đảm bản build không chứa emulator/localhost/khoá riêng
        run: |
          if grep -rIlE "127\.0\.0\.1:(8080|9099)|connectFirestoreEmulator|PRIVATE KEY" dist; then echo "::error::Bản build chứa tham chiếu emulator hoặc khoá riêng"; exit 1; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Xuất bản
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
